[tools]
python = "3.12.13"
uv = "0.11.8"
cmake = "4.4.4"
clang = "23.1.3"
rust = "1.98.1"

[bootstrap.packages]
"brew:m68k-elf-gcc" = "latest"
"brew:m68k-elf-binutils" = "latest"

[env]
_.path = ["/opt/homebrew/bin", "{{config_root}}/vendor/digikit/out/tools/selache/target/release"]
PYTHONPATH = "{{config_root}}/tools:{{config_root}}/vendor/elekloader"
ELEKLOADER_CROSS = "m68k-elf-"
CC = "clang"
CXX = "clang++"
DIGIEMU_HOME = "{{config_root}}/out/digiemu"
UV_CACHE_DIR = "{{config_root}}/out/uv-cache"

[tasks.bootstrap]
description = "Initialize the pinned dependencies and emulator toolchains"
run = [
  "git submodule update --init",
  'uv sync --frozen --project vendor/digiemu --python "$(mise which python)"',
  "cd vendor/digiemu && tools/install-patched-unicorn.sh",
  "cd vendor/digikit && python -m tools.patchkit.pk_toolchains selache",
]

[tasks.test]
description = "Run host fixtures, measurements and isolated C adapter tests"
run = [
  "python -m unittest discover -s tests/host -p 'test_*.py'",
  "mise run test:ui",
]

[tasks."test:host"]
description = "Run host fixtures and measurements without firmware or emulators"
run = "python -m unittest discover -s tests/host -p 'test_*.py'"

[tasks."test:ui"]
description = "Compile and run all C boundaries with fake native services"
run = [
  "python -m x0z.ui_test",
  "mise run test:ui:dt",
  "mise run test:ui:dn",
  "mise run test:ui:dn2",
]

[tasks."test:ui:dt"]
description = "Test the Digitakt C adapter without firmware or an emulator"
run = "python -m x0z.digitakt_adapter --host"

[tasks."test:ui:dn"]
description = "Test the Digitone C adapter without firmware or an emulator"
run = "python -m x0z.digitone_adapter --host"

[tasks."test:ui:dn2"]
description = "Test the Digitone II C adapter and approved controls without firmware or an emulator"
run = ["python -m x0z.digitone2_adapter --host", "mise run test:ui:dn2:controls"]

[tasks."test:ui:dn2:controls"]
description = "Test the approved DN2 808/909 pages and START-latched selector with a fake DSP"
run = "python -m x0z.digitone2_controls --host"

[tasks."test:ui:coldfire"]
description = "Check that C controls cross-compile without unsupported runtime helpers"
run = "python -m x0z.ui_test --coldfire"

[tasks."test:coldfire"]
description = "Execute bounded assembled diagnostics in digiemu"
run = 'PYTHONPATH="{{config_root}}/vendor/digiemu:$PYTHONPATH" uv run --frozen --project vendor/digiemu --python "$(mise which python)" python -m x0z.cpu coldfire'

[tasks."test:sharc"]
description = "Execute bounded assembled diagnostics in Digikit"
run = 'PYTHONPATH="{{config_root}}/vendor/digikit:$PYTHONPATH" python -m x0z.cpu sharc'

[tasks."test:coldfire:arithmetic"]
description = "Check fixed-point arithmetic, EMAC context and shared fixtures in digiemu"
run = 'PYTHONPATH="{{config_root}}/vendor/digiemu:$PYTHONPATH" uv run --frozen --project vendor/digiemu --python "$(mise which python)" python -m x0z.coldfire_arithmetic'

[tasks."test:sharc:callback"]
description = "Check the actual PR 200 voice ABI and slot state in Digikit"
run = 'PYTHONPATH="{{config_root}}/vendor/digikit:$PYTHONPATH" python -m x0z.sharc_callback'

[tasks."test:coldfire:selector"]
description = "Execute per-voice 808/909 selection and state guards in digiemu"
run = 'PYTHONPATH="{{config_root}}/vendor/digiemu:$PYTHONPATH" uv run --frozen --project vendor/digiemu --python "$(mise which python)" python -m x0z.coldfire_selector'

[tasks."test:sharc:selector"]
description = "Execute the DN2 selector diagnostic against the host C policy in Digikit"
run = 'PYTHONPATH="{{config_root}}/vendor/digikit:$PYTHONPATH" python -m x0z.sharc_selector'

[tasks."test:emulators"]
description = "Run bounded instruction, arithmetic, callback and selector diagnostics"
run = ["mise run test:coldfire", "mise run test:sharc", "mise run test:coldfire:arithmetic", "mise run test:sharc:callback", "mise run test:coldfire:selector", "mise run test:sharc:selector"]

[tasks."test:dt:component"]
description = "Execute the compiled Digitakt C adapter and ASM with native-service fakes"
run = 'PYTHONPATH="{{config_root}}/vendor/digiemu:$PYTHONPATH" uv run --frozen --project vendor/digiemu --python "$(mise which python)" python -m x0z.digitakt_adapter'

[tasks."test:dt:native"]
description = "Test bounded Digitakt OS routines, linked SDK values and the C-to-ASM path"
run = 'PYTHONPATH="{{config_root}}/vendor/digiemu:$PYTHONPATH" uv run --frozen --project vendor/digiemu --python "$(mise which python)" python -m x0z.digitakt_adapter --native'

[tasks."test:dt:transport"]
description = "Boot Digitakt and trace native panel PLAY through C and ASM observers"
run = 'PYTHONPATH="{{config_root}}/vendor/digiemu:$PYTHONPATH" uv run --frozen --project vendor/digiemu --python "$(mise which python)" python -m x0z.digitakt_transport'

[tasks."test:dn:component"]
description = "Execute the compiled Digitone C adapter and ASM with native-service fakes"
run = 'PYTHONPATH="{{config_root}}/vendor/digiemu:$PYTHONPATH" uv run --frozen --project vendor/digiemu --python "$(mise which python)" python -m x0z.digitone_adapter'

[tasks."test:dn:companion"]
description = "Test Digitone companion START, gate and AMP/velocity with stock parameter records"
run = 'PYTHONPATH="{{config_root}}/vendor/digiemu:$PYTHONPATH" uv run --frozen --project vendor/digiemu --python "$(mise which python)" python -m x0z.digitone_adapter --companion'

[tasks."test:dn:native"]
description = "Test bounded Digitone OS live edits through the linked SDK and C-to-ASM path"
run = 'PYTHONPATH="{{config_root}}/vendor/digiemu:$PYTHONPATH" uv run --frozen --project vendor/digiemu --python "$(mise which python)" python -m x0z.digitone_adapter --native'

[tasks."test:dn:frame"]
description = "Test final DN frames through the C adapter and ASM with injected native state"
run = 'PYTHONPATH="{{config_root}}/vendor/digiemu:$PYTHONPATH" uv run --frozen --project vendor/digiemu --python "$(mise which python)" python -m x0z.digitone_transport'

[tasks."test:dn:transport"]
description = "Test DN final-frame adapter diagnostics in a standard non-strict full-OS Session"
run = 'PYTHONPATH="{{config_root}}/vendor/digiemu:$PYTHONPATH" uv run --frozen --project vendor/digiemu --python "$(mise which python)" python -m x0z.digitone_transport --full-os'

[tasks."test:dn2:component"]
description = "Test Digitone II C snapshots and the pinned SHARC bridge in Digikit"
run = 'PYTHONPATH="{{config_root}}/vendor/digikit:$PYTHONPATH" python -m x0z.digitone2_adapter'

[tasks."test:adapters"]
description = "Run firmware-independent C-to-ASM adapter component checks"
run = ["mise run test:dt:component", "mise run test:dn:component", "mise run test:dn2:component"]

[tasks."firmware:verify"]
description = "Verify the latest-only local stock images and pinned SDK identities"
run = "python -m x0z.firmware verify"

[tasks."build:deps:dt"]
description = "Build Core and machine-pages for the latest Digitakt OS"
run = "python -m x0z.firmware build-deps dt"

[tasks."build:deps:dn"]
description = "Build Core and machines for the latest Digitone OS"
run = "python -m x0z.firmware build-deps dn"

[tasks."build:deps:dn2"]
description = "Build Core for the latest Digitone II OS"
run = "python -m x0z.firmware build-deps dn2"

[tasks."firmware:dt"]
description = "Package a latest-OS Core/companion baseline for Digitakt emulator work"
run = "python -m x0z.firmware baseline dt"

[tasks."firmware:dn"]
description = "Package a latest-OS Core/companion baseline for Digitone emulator work"
run = "python -m x0z.firmware baseline dn"

[tasks."firmware:dn2"]
description = "Package a latest-OS Core baseline for Digitone II emulator work"
run = "python -m x0z.firmware baseline dn2"

[tasks."test:dt"]
description = "Digitakt firmware integration availability"
run = "python -m x0z.cli unavailable dt"

[tasks."test:dn"]
description = "Digitone firmware integration availability"
run = "python -m x0z.cli unavailable dn"

[tasks."test:dn2"]
description = "Digitone II firmware integration availability"
run = "python -m x0z.cli unavailable dn2"

[tasks.render]
description = "Render a synthetic diagnostic fixture as test equipment"
run = "python -m x0z.cli render"

[tasks.analyze]
description = "Measure a mono WAV or validated render result"
run = "python -m x0z.cli analyze"

[tasks.compare]
description = "Compare fixture-matched render results against an independent oracle"
run = "python -m x0z.cli compare"
