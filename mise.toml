[tools]
python = "3.12.13"
uv = "0.11.8"
cmake = "4.4.4"
clang = "23.1.3"
rust = "1.98.1"
node = "24.10.0"

[bootstrap.packages]
"brew:m68k-elf-gcc" = "latest"
"brew:m68k-elf-binutils" = "latest"

[env]
_.path = ["/opt/homebrew/bin", "{{config_root}}/vendor/digikit/out/tools/selache/target/release"]
PYTHONPATH = "{{config_root}}/tools:{{config_root}}/vendor/elekloader"
ELEKLOADER_CROSS = "m68k-elf-"
CC = "clang"
CXX = "clang++"
DIGIEMU_HOME = "{{config_root}}/out/digiemu"
UV_CACHE_DIR = "{{config_root}}/out/uv-cache"

[tasks.bootstrap]
description = "Initialize the pinned dependencies and emulator toolchains"
run = [
  "git submodule update --init",
  'uv sync --frozen --project vendor/digiemu --python "$(mise which python)"',
  "cd vendor/digiemu && tools/install-patched-unicorn.sh",
  "cd vendor/digikit && python -m tools.patchkit.pk_toolchains selache",
]

[tasks.test]
description = "Run current model, assembled engines and native C adapter checks"
env = { OPENBLAS_NUM_THREADS = "1", VECLIB_MAXIMUM_THREADS = "1" }
run = [
  'PYTHONPATH="{{config_root}}/vendor/digikit:{{config_root}}/vendor/digiemu:$PYTHONPATH" uv run --frozen --project vendor/digiemu --with numpy==2.5.4 --with scipy==1.18.0 --with soundfile==0.14.0 --with networkx==3.4.2 --with mypy==2.3.1 --python "$(mise which python)" python -m unittest discover -s tests/host -p test_*.py',
  'mise exec -- node tests/host/listening808.js',
  'python -m x0x.ui_test',
]

[tasks."firmware:dt"]
description = "Build the normal combined dt x0x mod"
env = { OPENBLAS_NUM_THREADS = "1", VECLIB_MAXIMUM_THREADS = "1" }
run = 'PYTHONPATH="{{config_root}}/vendor/digikit:{{config_root}}/vendor/digiemu:$PYTHONPATH" uv run --frozen --project vendor/digiemu --with numpy==2.5.4 --with scipy==1.18.0 --with soundfile==0.14.0 --with networkx==3.4.2 --with mypy==2.3.1 --python "$(mise which python)" python -m x0x.build dt'

[tasks."firmware:dn"]
description = "Build the normal combined dn x0x mod"
env = { OPENBLAS_NUM_THREADS = "1", VECLIB_MAXIMUM_THREADS = "1" }
run = 'PYTHONPATH="{{config_root}}/vendor/digikit:{{config_root}}/vendor/digiemu:$PYTHONPATH" uv run --frozen --project vendor/digiemu --with numpy==2.5.4 --with scipy==1.18.0 --with soundfile==0.14.0 --with networkx==3.4.2 --with mypy==2.3.1 --python "$(mise which python)" python -m x0x.build dn'

[tasks."firmware:dn2"]
description = "Build the normal combined dn2 x0x mod"
env = { OPENBLAS_NUM_THREADS = "1", VECLIB_MAXIMUM_THREADS = "1" }
run = 'PYTHONPATH="{{config_root}}/vendor/digikit:{{config_root}}/vendor/digiemu:$PYTHONPATH" uv run --frozen --project vendor/digiemu --with numpy==2.5.4 --with scipy==1.18.0 --with soundfile==0.14.0 --with networkx==3.4.2 --with mypy==2.3.1 --python "$(mise which python)" python -m x0x.build dn2'

[tasks."test:dt:mod"]
description = "Bounded native-panel smoke of the normal dt package"
env = { OPENBLAS_NUM_THREADS = "1", VECLIB_MAXIMUM_THREADS = "1" }
run = 'PYTHONPATH="{{config_root}}/vendor/digikit:{{config_root}}/vendor/digiemu:$PYTHONPATH" uv run --frozen --project vendor/digiemu --with numpy==2.5.4 --with scipy==1.18.0 --with soundfile==0.14.0 --with networkx==3.4.2 --with mypy==2.3.1 --python "$(mise which python)" python -m x0x.mod_smoke dt'

[tasks."test:dn:mod"]
description = "Bounded native-panel smoke of the normal dn package"
env = { OPENBLAS_NUM_THREADS = "1", VECLIB_MAXIMUM_THREADS = "1" }
run = 'PYTHONPATH="{{config_root}}/vendor/digikit:{{config_root}}/vendor/digiemu:$PYTHONPATH" uv run --frozen --project vendor/digiemu --with numpy==2.5.4 --with scipy==1.18.0 --with soundfile==0.14.0 --with networkx==3.4.2 --with mypy==2.3.1 --python "$(mise which python)" python -m x0x.mod_smoke dn'

[tasks."research:808:sharc-model"]
description = "Compare actual sharc ASM with the frozen model and source cohort"
env = { OPENBLAS_NUM_THREADS = "1", VECLIB_MAXIMUM_THREADS = "1" }
run = 'PYTHONPATH="{{config_root}}/vendor/digikit:{{config_root}}/vendor/digiemu:$PYTHONPATH" uv run --frozen --project vendor/digiemu --with numpy==2.5.4 --with scipy==1.18.0 --with soundfile==0.14.0 --with networkx==3.4.2 --with mypy==2.3.1 --with matplotlib==3.11.2 --python "$(mise which python)" python -m x0x.sharc_field808 qualify'

